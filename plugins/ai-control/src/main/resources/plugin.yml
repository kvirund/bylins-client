id: ai-control
name: Управление ИИ
version: 1.0.0
main: com.bylins.client.aicontrol.AiControlPlugin
author: Bylins Client
description: |
  Даёт внешним ИИ-агентам управляемый доступ к сессии игры.

  Каждый агент открывает свой контекст (сессию): получает вывод с момента
  последнего чтения, отправляет команды, вешает свои триггеры. При закрытии
  контекста все его ресурсы снимаются автоматически.

  Команды:
  - #ai status       - состояние сервера и список сессий
  - #ai list         - список подключённых ИИ
  - #ai kick <id>    - закрыть сессию
  - #ai mute <id>    - запретить сессии отправлять команды
  - #ai start/stop   - запустить/остановить локальный сервер

permissions:
  - network-server
  - client-control
  - connection-control
